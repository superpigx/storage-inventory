name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install & build H5
        working-directory: app
        run: |
          npm ci
          npm run build:h5
      # Android APK: P4 接入 Capacitor android 平台后启用以下步骤
      # - uses: actions/setup-java@v4
      #   with:
      #     distribution: zulu
      #     java-version: '17'
      # - name: Build APK
      #   working-directory: app
      #   run: npx cap sync android && cd android && ./gradlew assembleRelease
      # - name: Upload APK to Release
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     files: app/android/app/build/outputs/apk/release/*.apk
      - name: Upload H5 bundle
        uses: actions/upload-artifact@v4
        with:
          name: h5-bundle
          path: app/dist
