name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install & build H5
        working-directory: app
        run: |
          npm ci
          npm run build:h5
      # Android APK: P4 接入 Capacitor android 平台后启用以下步骤
      # - uses: actions/setup-java@v4
      #   with:
      #     distribution: zulu
      #     java-version: '17'
      # - name: Build APK
      #   working-directory: app
      #   run: npx cap sync android && cd android && ./gradlew assembleRelease
      # - name: Upload APK to Release
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     files: app/android/app/build/outputs/apk/release/*.apk
      - name: Package H5 bundle
        working-directory: app
        run: tar czf dist-h5.tar.gz dist
      - name: Generate update manifest (双源)
        working-directory: app
        env:
          GITHUB_REPO_SLUG: ${{ github.repository }}
          RELEASE_NOTES: "Automated release"
        run: node scripts/gen-manifest.js
      - name: Upload H5 bundle + manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            app/dist-h5.tar.gz
            app/dist/manifest.json
